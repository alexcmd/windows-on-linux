name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:

  lint-shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint bash scripts
        run: |
          shellcheck -S warning \
            install.sh \
            bin/proton-run \
            bin/proton-install

  lint-python:
    name: flake8 + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: pip install flake8 mypy --quiet

      - name: flake8
        run: flake8 --max-line-length=120 bin/steam-shortcut

      - name: mypy
        run: mypy --strict bin/steam-shortcut

  validate-apkbuild:
    name: APKBUILD syntax
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
    steps:
      - uses: actions/checkout@v4

      - name: Install abuild
        run: apk add --no-cache alpine-sdk

      - name: Validate APKBUILD
        run: |
          cd packaging/alpine
          # apkbuild-lint checks for common mistakes
          apkbuild-lint APKBUILD || true
          # Verify the file is sourceable without errors
          sh -n APKBUILD

  validate-flatpak:
    name: Flatpak manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder python3-yaml

      - name: Validate manifest
        run: |
          flatpak-builder --show-manifest \
            packaging/flatpak/org.sdeck.ProtonRun.yml > /dev/null
